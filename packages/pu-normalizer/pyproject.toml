[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pu-normalizer"
version = "0.1.0"
description = "Shared per-unit boundary conversions for OPF teachers and OpenDSS environments"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["pu_normalizer*"]
